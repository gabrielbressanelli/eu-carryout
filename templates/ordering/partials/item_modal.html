<div class="modal fade" id="itemModal" tabindex="-1" aria-labelledby="itemModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header"><h2 class="modal-title h5" id="itemModalTitle">Customize item</h2><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <form method="post" data-item-form class="item-customizer">{% csrf_token %}
        <div class="modal-body">
          <div data-item-loading role="status">Loading item...</div>
          <div data-item-content hidden>
            <img data-item-image class="customizer-image" alt="" hidden>
            <p data-item-description class="text-muted"></p>
            <div data-modifier-groups></div>
            <div class="mt-3"><label class="form-label" for="item-note">Special instructions</label><textarea id="item-note" name="note" maxlength="255" rows="2" class="form-control"></textarea></div>
            <div class="mt-3"><label class="form-label" for="item-quantity">Quantity</label><input id="item-quantity" name="quantity" class="form-control qty-input" type="number" min="1" max="99" value="1"></div>
          </div>
          <p data-item-error class="text-danger mt-3 mb-0" role="status" aria-live="polite"></p>
        </div>
        <div class="modal-footer"><button class="btn btn-dark w-100" type="submit" data-item-submit disabled><span data-item-command>Add to cart</span><span data-item-total class="ms-2"></span></button></div>
      </form>
    </div>
  </div>
</div>
