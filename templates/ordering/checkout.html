<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout - {{ tenant.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/site.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg glass-nav fixed-top">
      <div class="container px-4 px-lg-5 nav-main-row">
        <a class="navbar-brand" href="{% url 'menu' tenant_slug=tenant.slug %}">{{ tenant.name }}</a>
        <div class="d-flex align-items-center gap-2">
          <a class="btn btn-outline-dark" href="{% url 'menu' tenant_slug=tenant.slug %}">Menu</a>
          <button class="btn btn-outline-dark cart-button" type="button" data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas" aria-controls="cartOffcanvas">
            Cart
            <span class="badge bg-dark text-white ms-1 rounded-pill {% if cart|length == 0 %}d-none{% endif %}" data-cart-count>{{ cart|length }}</span>
          </button>
        </div>
      </div>
    </nav>

    <main class="container checkout-shell">
      <div class="row">
        <div class="col-lg-7 mx-auto">
          <div id="checkoutSummaryPanel">
            {% include "ordering/partials/checkout_summary.html" %}
          </div>

          <div class="checkout-actions">
            <form method="post" action="{% url 'create_checkout_session' tenant.slug %}" data-checkout-form>
              {% csrf_token %}
              <h2 class="h5">Pickup time</h2>
              <p data-availability-message role="status">{{ availability.message }}</p>
              <label for="pickup-time" class="form-label">{{ tenant.name }} pickup ({{ availability.timezone }})</label>
              <select class="form-select mb-3" id="pickup-time" name="pickup" required data-pickup-select>
                {% if availability.asap_available %}<option value="asap">As soon as possible</option>{% endif %}
                {% for slot in availability.slots %}<option value="{{ slot.value }}">{{ slot.label }}</option>{% endfor %}
                {% if not availability.can_order %}<option value="">No pickup times available</option>{% endif %}
              </select>
              <input type="hidden" name="cart_revision" value="{{ cart_revision }}">
              <p class="text-danger" data-checkout-error role="alert"></p>
              <button id="pay-btn" type="submit" class="btn btn-dark btn-lg" data-pay-button {% if not lines or cart_errors or not availability.can_order %}disabled{% endif %}>Proceed to Payment</button>
            </form>
          </div>
        </div>
      </div>
    </main>
    <div
      id="cart-config"
      data-summary-url="{% url 'cart_summary' tenant_slug=tenant.slug %}"
      data-count-url="{% url 'cart_count' tenant_slug=tenant.slug %}"
      data-availability-url="{% url 'pickup_availability' tenant.slug %}"
    ></div>
    {% include "ordering/partials/cart_offcanvas.html" %}
    {% include "ordering/partials/item_modal.html" %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/cart.js"></script>
  </body>
</html>
