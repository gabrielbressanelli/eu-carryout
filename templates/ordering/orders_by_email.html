<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orders - {{ tenant.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/site.css">
  </head>
  <body>
    <main class="container checkout-shell">
      <h1 class="h3">Orders</h1>
      <form class="row g-2 mb-4">
        <div class="col-sm-8">
          <input class="form-control" type="email" name="email" value="{{ email }}" placeholder="Email">
        </div>
        <div class="col-sm-4">
          <button class="btn btn-dark w-100" type="submit">Search</button>
        </div>
      </form>
      {% for order in orders %}
        <div class="card mb-3">
          <div class="card-body">
            <div class="d-flex justify-content-between">
              <strong>Order #{{ order.id }}</strong>
              <span>${{ order.amount_paid }}</span>
            </div>
            <div class="text-muted">{{ order.created_at }}</div>
            <p class="mb-0">{{ order.order_summary }}</p>
          </div>
        </div>
      {% empty %}
        {% if email %}<p class="text-muted">No paid orders found for this email.</p>{% endif %}
      {% endfor %}
    </main>
  </body>
</html>
